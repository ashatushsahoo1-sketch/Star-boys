<section id="our-family" class="our-family-section section-padding">
  <div class="container">

    <!-- Section Header -->
    <div class="section-header">
      <span class="section-tagline">ଆମ ପରିବାର</span>
      <h2 class="section-title gold-gradient-text">Our Family</h2>
      <div class="divider-ornament">
        <span class="ornament-line"></span>
        <span class="ornament-diya">🪔</span>
        <span class="ornament-line"></span>
      </div>
      <p class="section-subtitle">
        United by devotion, bound by love — the Star Boys family that makes every Laxmi Puja a sacred celebration.
      </p>
    </div>

    <!-- Family Photo Frame -->
    <div class="family-photo-wrapper">
      <div class="photo-frame-glow"></div>
      <div class="photo-frame glass-card">
        <div class="frame-corner corner-tl"></div>
        <div class="frame-corner corner-tr"></div>
        <div class="frame-corner corner-bl"></div>
        <div class="frame-corner corner-br"></div>

        <div class="photo-inner">
          <img
            src="assets/images/family/family-group.jpg"
            alt="Star Boys Laxmi Puja Committee — Our Family"
            class="family-photo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <!-- Fallback placeholder when image is not yet uploaded -->
          <div class="photo-placeholder" style="display:none;">
            <div class="placeholder-inner">
              <div class="placeholder-icon">👨‍👩‍👧‍👦</div>
              <p class="placeholder-text">Family Photo</p>
              <span class="placeholder-hint">Place your photo at<br><code>assets/images/family/family-group.jpg</code></span>
            </div>
          </div>
        </div>

        <div class="photo-caption">
          <i class="fa-solid fa-star caption-star"></i>
          <span>Star Boys Laxmi Puja Committee — School Sahi, Ghantapada, Talcher</span>
          <i class="fa-solid fa-star caption-star"></i>
        </div>
      </div>
    </div>

  </div>
</section>
